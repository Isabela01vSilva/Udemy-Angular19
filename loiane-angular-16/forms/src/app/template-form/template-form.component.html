<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="form-horizontal">
  <!-- Nome -->
  <div class="form-group" [ngClass]="aplicaCssErro(nome)">
    <div class="col-sm-12">
      <label for="nome" class="control-label">Nome</label>
    </div>

    <div class="col-sm-12">
      <input
        type="text"
        class="form-control"
        id="nome"
        placeholder="Nome"
        [(ngModel)]="usuario.nome"
        name="nome"
        required
        #nome="ngModel"
      />

      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched(nome)"
        errorMessage="Nome é obrigatório."
      ></app-campo-control-erro>
    </div>
  </div>

  <!-- Email -->
  <div class="form-group" [ngClass]="aplicaCssErro(email)">
    <div class="col-sm-12">
      <label for="email" class="control-label">Email address</label>
    </div>

    <div class="col-sm-12">
      <input
        type="email"
        class="form-control"
        id="email"
        placeholder="E-mail"
        [(ngModel)]="usuario.email"
        name="email"
        #email="ngModel"
        required
        email
      />

      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched(email)"
        errorMessage="Email é obrigatório"
      ></app-campo-control-erro>
    </div>
  </div>

  <!-- CEP -->
  <div class="form-group">
    <div class="col-md-3" [ngClass]="aplicaCssErro(cep)">
      <label for="cep" class="control-label">CEP</label>
      <input
        type="text"
        class="form-control"
        id="cep"
        name="cep"
        ngModel
        required
        #cep="ngModel"
      />

      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched(cep)"
        errorMessage="CEP é obrigatório"
      >
      </app-campo-control-erro>
    </div>

    <!-- Número -->
    <div class="col-md-3" [ngClass]="aplicaCssErro(numero)">
      <label for="numero" class="control-label">Número</label>
      <input
        type="text"
        class="form-control"
        id="numero"
        name="numero"
        ngModel
        required
        #numero="ngModel"
      />
      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched(numero)"
        errorMessage="Número é obrigatório"
      ></app-campo-control-erro>
    </div>

    <!-- Complemento -->
    <div class="col-md-6">
      <label for="complemento" class="control-label">Complemento</label>
      <input
        type="text"
        class="form-control"
        id="complemento"
        name="complemento"
        ngModel
        #complemento="ngModel"
      />
    </div>
  </div>

  <!-- Rua -->
  <div class="form-group">
    <div class="col-sm-12">
      <label for="rua" class="control-label">Rua</label>
    </div>

    <div class="col-sm-12">
      <input
        type="text"
        class="form-control"
        id="rua"
        [(ngModel)]="usuario.rua"
        name="rua"
        required
        #rua="ngModel"
        readonly
      />
      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched(rua)"
        errorMessage="Rua é obrigatória"
      ></app-campo-control-erro>
    </div>
  </div>

  <div class="form-group">
    <!-- Bairro -->
    <div class="col-md-5" [ngClass]="aplicaCssErro(bairro)">
      <label for="bairro" class="control-label">Bairro </label>
      <input
        type="text"
        class="form-control"
        id="bairro"
        name="bairro"
        ngModel
        required
        #bairro="ngModel"
      />
      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched(bairro)"
        errorMessage="Bairro é obrigatório"
      ></app-campo-control-erro>
    </div>

    <!-- Cidade -->
    <div class="col-md-4" [ngClass]="aplicaCssErro(cidade)">
      <label for="cidade" class="control-label">Cidade</label>
      <input
        type="text"
        class="form-control"
        id="cidade"
        name="cidade"
        ngModel
        required
        #cidade="ngModel"
      />
      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched(cidade)"
        errorMessage="Cidade é obrigatória"
      ></app-campo-control-erro>
    </div>

    <!-- Estado -->
    <div class="col-md-3" [ngClass]="aplicaCssErro(estado)">
      <label for="estado" class="control-label">Estado</label>
      <input
        type="text"
        class="form-control"
        id="estado"
        name="estado"
        ngModel
        required
        #estado="ngModel"
      />
      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched(estado)"
        errorMessage="Estado é obrigatório"
      ></app-campo-control-erro>
    </div>
  </div>

  <!-- Botão submit -->
  <button type="submit" class="btn btn-primary" [disabled]="!f.valid">
    Submit
  </button>

  <app-form-debug [form]="f"></app-form-debug>
</form>
