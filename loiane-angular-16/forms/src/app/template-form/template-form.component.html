<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="form-horizontal">
  <div
    class="form-group"
    [class.has-error]="nome.invalid && nome.touched"
    [class.has-feedback]="nome.invalid && nome.touched"
  >
    <!-- Nome -->
    <div class="col-sm-12">
      <label for="nome" class="control-label">Nome</label>
    </div>

    <div class="col-sm-12">
      <input
        type="text"
        class="form-control"
        id="nome"
        placeholder="Nome"
        [(ngModel)]="usuario.nome"
        name="nome"
        required
        #nome="ngModel"
      />
      <!-- <div>
      {{ nome.className }}
    </div> -->
      <span
        class="glyphicon glyphicon-remove form-control-feedback"
        arian-hidden="true"
        *ngIf="nome.invalid && nome.touched"
      ></span>

      <div *ngIf="nome.invalid && nome.touched" class="alert alert-danger">
        Nome é obrigatório
      </div>
    </div>
  </div>

  <!-- Email -->
  <div
    class="form-group"
    [class.has-error]="email.invalid && email.touched"
    [class.has-feedback]="email.invalid && email.touched"
  >
    <div class="col-sm-12">
      <label for="email" class="control-label">Email address</label>
    </div>

    <div class="col-sm-12">
      <input
        type="email"
        class="form-control"
        id="email"
        placeholder="E-mail"
        [(ngModel)]="usuario.email"
        name="email"
        #email="ngModel"
        required
        email
      />
      <span
        class="glyphicon glyphicon-remove form-control-feedback"
        arian-hidden="true"
        *ngIf="email.invalid && email.touched"
      ></span>

      <div *ngIf="email.invalid && email.touched" class="alert alert-danger">
        Email é obrigatório
      </div>
    </div>
  </div>

  <!-- CEP -->
  <div class="form-group">
    <div
      class="col-md-3"
      [class.has-error]="cep.invalid && cep.touched"
      [class.has-feedback]="cep.invalid && cep.touched"
    >
      <label for="cep" class="control-label">CEP</label>
      <input
        type="text"
        class="form-control"
        id="cep"
        name="cep"
        ngModel
        required
        #cep="ngModel"
      />
      <span
        class="glyphicon glyphicon-remove form-control-feedback"
        arian-hidden="true"
        *ngIf="cep.invalid && cep.touched"
      ></span>

      <div *ngIf="cep.invalid && cep.touched" class="alert alert-danger">
        CEP é obrigatório
      </div>
    </div>

    <!-- Número -->
    <div
      class="col-md-3"
      [class.has-error]="numero.invalid && numero.touched"
      [class.has-feedback]="numero.invalid && numero.touched"
    >
      <label for="numero" class="control-label">Número</label>
      <input
        type="text"
        class="form-control"
        id="numero"
        name="numero"
        ngModel
        required
        #numero="ngModel"
      />
      <span
        class="glyphicon glyphicon-remove form-control-feedback"
        arian-hidden="true"
        *ngIf="numero.invalid && numero.touched"
      ></span>

      <div *ngIf="numero.invalid && numero.touched" class="alert alert-danger">
        Número é obrigatório
      </div>
    </div>

    <!-- Complemento -->
    <div class="col-md-6">
      <label for="complemento" class="control-label">Complemento</label>
      <input
        type="text"
        class="form-control"
        id="complemento"
        name="complemento"
        ngModel
        #complemento="ngModel"
      />
    </div>
  </div>

  <!-- Rua -->
  <div class="form-group">
    <div class="col-sm-12">
      <label for="rua" class="control-label">Rua</label>
    </div>

    <div class="col-sm-12">
      <input
        type="text"
        class="form-control"
        id="rua"
        [(ngModel)]="usuario.rua"
        name="rua"
        required
        #rua="ngModel"
        readonly
      />
      <span
        class="glyphicon glyphicon-remove form-control-feedback"
        arian-hidden="true"
        *ngIf="!rua.invalid"
      ></span>

      <div *ngIf="!rua.invalid" class="alert alert-danger">
        Rua é obrigatória
      </div>
    </div>
  </div>

  <div class="form-group">
    <!-- Bairro -->
    <div
      class="col-md-5"
      [class.has-error]="bairro.invalid && bairro.touched"
      [class.has-feedback]="bairro.invalid && bairro.touched"
    >
      <label for="bairro" class="control-label">Bairro </label>
      <input
        type="text"
        class="form-control"
        id="bairro"
        name="bairro"
        ngModel
        required
        #bairro="ngModel"
      />
      <span
        class="glyphicon glyphicon-remove form-control-feedback"
        arian-hidden="true"
        *ngIf="bairro.invalid && bairro.touched"
      ></span>

      <div *ngIf="bairro.invalid && bairro.touched" class="alert alert-danger">
        Bairro é obrigatório
      </div>
    </div>

    <!-- Cidade -->
    <div
      class="col-md-4"
      [class.has-error]="cidade.invalid && cidade.touched"
      [class.has-feedback]="cidade.invalid && cidade.touched"
    >
      <label for="cidade" class="control-label">Cidade</label>
      <input
        type="text"
        class="form-control"
        id="cidade"
        name="cidade"
        ngModel
        required
        #cidade="ngModel"
      />
      <span
        class="glyphicon glyphicon-remove form-control-feedback"
        arian-hidden="true"
        *ngIf="cidade.invalid && cidade.touched"
      ></span>

      <div *ngIf="cidade.invalid && cidade.touched" class="alert alert-danger">
        Cidade é obrigatória
      </div>
    </div>

    <!-- Estado -->
    <div
      class="col-md-3"
      [class.has-error]="estado.invalid && estado.touched"
      [class.has-feedback]="estado.invalid && estado.touched"
    >
      <label for="estado" class="control-label">Estado</label>
      <input
        type="text"
        class="form-control"
        id="estado"
        name="estado"
        ngModel
        required
        #estado="ngModel"
      />
      <span
        class="glyphicon glyphicon-remove form-control-feedback"
        arian-hidden="true"
        *ngIf="estado.invalid && estado.touched"
      ></span>

      <div *ngIf="estado.invalid && estado.touched" class="alert alert-danger">
        Estado é obrigatório
      </div>
    </div>
  </div>

  <!-- Botão submit -->
  <button type="submit" class="btn btn-primary" [disabled]="!f.valid">
    Submit
  </button>

  <app-form-debug [form]="f"></app-form-debug>
</form>
