<div fxLayout="row" fxLayoutAlign="center center" class="cadastro-container">
  <div fxLayout="column" fxFlex="900px">
    <form class="mt-60" #clientesFrm="ngForm" (ngSubmit)="salvar()">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Dados Pessoais</mat-card-title>
        </mat-card-header>

        <mat-card-content class="mt-20">
          <div fxLayout="row" fixLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="800px">
              <mat-form-field class="full-width">
                <mat-label>Nome*</mat-label>
                <input
                  type="text"
                  [(ngModel)]="cliente.nome"
                  name="nome"
                  placeholder="Ex: Isabela"
                  matInput
                />
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="800px">
              <mat-form-field class="full-width">
                <mat-label>Email*</mat-label>
                <input
                  type="text"
                  [(ngModel)]="cliente.email"
                  name="email"
                  placeholder="Ex: isabela@email.com"
                  matInput
                />
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>CPF*</mat-label>
                <input
                  type="text"
                  [(ngModel)]="cliente.cpf"
                  name="cpf"
                  placeholder="Ex: 123.456.789-00"
                  mask="000.000.000-00"
                  matInput
                />
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>Data Nascimento*</mat-label>
                <input
                  type="text"
                  [(ngModel)]="cliente.dataNascimento"
                  name="dataNascimento"
                  placeholder="Ex: 01/01/1990"
                  mask="00/00/0000"
                  matInput
                />
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>UF*</mat-label>
                <mat-select [(value)]="cliente.uf" (selectionChange)="carregarMunicipios($event)">
                  @for (estado of estados; track estado) {
                    <mat-option [value]="estado.sigla">{{ estado.sigla }} - {{ estado.nome }}</mat-option>
                  }
                </mat-select>
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>Município: *</mat-label>
                <mat-select [(value)]="cliente.municipio">
                  @for (municipio of municipios; track municipio) {
                    <mat-option [value]="municipio.nome">{{ municipio.nome }}</mat-option>
                  }
                </mat-select>
              </mat-form-field>
            </div>
          </div>
          
        </mat-card-content>

        <mat-card-actions>
          @if (!atualizando) {
            <button mat-flat-button color="primary" type="submit">
              <mat-icon fontIcon="save"></mat-icon>
              Salvar
            </button>
          }

          @if (atualizando) {
            <button mat-flat-button color="primary">
              <mat-icon fontIcon="refresh"></mat-icon>
              Atualizar
            </button>
          }

          <button mat-flat-button color="accent" class="ml-5">
            <mat-icon fontIcon="backspace"></mat-icon>
            Limpar
          </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
