<div
  class="bg-gradient-to-r from-blue-500 to-blue-800 text-white flex flex-col justify-center items-center"
>
  <div class="text-center px-6">
    <h1 class="text-4xl font-bold mb-4">
      Bem Vindo á sua lista de lugares favoritos!
    </h1>
    <p class="text-lg mb-6">
      Exploque, organize e compartilhe os lugares que você adora
    </p>
  </div>

  @if (isLoggeIn()) {
    <button
      (click)="navegar()"
      class="bg-white text-blue-400 font-semibold py-3 px-8 rounded-full hover:bg-gray-100 flex space-x-3 items-center"
    >
      Olá {{ profile?.nome }}, clique aqui para acessar o site
    </button>
  }
  @if (!isLoggeIn()) {
    <button
      (click)="logarComGoogle()"
      class="bg-white text-blue-700 font-semibold py-3 px-8 rounded-full hover:bg-gray-100 flex space-x-3 items-center"
    >
      <img
        width="30"
        src="https://agenciapnz.com/wp-content/uploads/Logo-Google-G.png"
        alt="Google Logo"
      />
      Logar com Google
    </button>
  }
</div>
